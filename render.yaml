services:
  - type: web
    name: playhouse-chogathon
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playhouse-db
          property: connectionString
      - key: PLAYHOUSE_APP_ORIGIN
        value: https://playhouse-chogathon.onrender.com

databases:
  - name: playhouse-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: '18'
